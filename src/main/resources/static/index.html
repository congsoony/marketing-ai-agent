<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>유튜브 댓글 에이전트 대시보드</title>
  <link rel="stylesheet" href="/style.css"/>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>유튜브 댓글 에이전트</h1>
      <span class="subtitle">영상 불러오기 → 고르기 → 버튼 한 번에 크롬이 열리며 직접 타이핑</span>
    </div>
    <div id="badges" class="badges"></div>
  </header>

  <div id="keyWarn" class="key-warn hidden"></div>

  <main class="board">
    <!-- ① 영상 불러오기 -->
    <section class="col" id="col1">
      <div class="col-head"><span class="step">①</span> 영상 불러오기</div>
      <div class="col-body">
        <div class="row">
          <input id="query" type="text" placeholder="검색어 (기본: 연애)"/>
          <button id="btnLoad" class="primary">영상 불러오기</button>
        </div>
        <div class="row">
          <button id="btnTrending" class="ghost" title="조회 1,000~5,000 · 시간당 150↑">🔥 뜨기 직전 영상</button>
        </div>
        <div class="row link-row">
          <input id="linkInput" type="text" placeholder="또는 유튜브 링크 직접 입력"/>
          <button id="btnLink" class="ghost">선택</button>
        </div>
        <div id="videoList" class="video-list">
          <p class="empty">「영상 불러오기」를 눌러 최신 영상을 가져오세요.</p>
        </div>
      </div>
    </section>

    <!-- ② 영상 선택 → 고민 한 줄 + 댓글 초안 -->
    <section class="col" id="col2">
      <div class="col-head"><span class="step">②</span> 영상 선택 · 댓글 초안</div>
      <div class="col-body">
        <div id="selected" class="selected empty-state">
          <p class="empty">왼쪽에서 영상을 고르면 AI가 「영상 속 고민 한 줄」과 「댓글 초안」을 만들어 줍니다.</p>
        </div>

        <div id="draftArea" class="hidden">
          <div class="concern">
            <label>영상 속 고민 한 줄</label>
            <p id="concern"></p>
          </div>
          <div class="draft">
            <label>댓글 초안 <span id="charCount" class="char"></span></label>
            <textarea id="comment" rows="5"></textarea>
          </div>
          <div class="row">
            <button id="btnRegen" class="ghost">↻ 초안 다시 생성</button>
            <select id="profileSel" title="사용할 크롬 프로필"></select>
          </div>
          <p class="hint">금지: 링크 · 해시태그 · 운명원을 직접 써본 듯한 후기</p>
        </div>
      </div>
    </section>

    <!-- ③ 댓글 달기 -->
    <section class="col" id="col3">
      <div class="col-head"><span class="step">③</span> 댓글 달기</div>
      <div class="col-body">
        <button id="btnPost" class="primary big" disabled>댓글 달기</button>
        <div id="progress" class="progress hidden">
          <div class="steps">
            <span class="pstep" data-s="OPENING">프로필 여는 중</span>
            <span class="pstep" data-s="TYPING">입력 중</span>
            <span class="pstep" data-s="SUCCESS">게시 완료</span>
          </div>
          <p id="progressNote" class="note"></p>
          <p id="failReason" class="fail hidden"></p>
          <a id="shotLink" href="#" target="_blank" class="hidden">
            <img id="shot" class="shot" alt="화면 캡처"/>
          </a>
        </div>
      </div>
    </section>
  </main>

  <!-- 기록 -->
  <section class="logs">
    <div class="logs-head">
      <h2>기록</h2>
      <button id="btnRefreshLogs" class="ghost small">새로고침</button>
    </div>
    <table>
      <thead>
        <tr><th>시간</th><th>영상</th><th>프로필</th><th>댓글</th><th>상태</th><th>캡처</th></tr>
      </thead>
      <tbody id="logBody"><tr><td colspan="6" class="empty">아직 기록이 없습니다.</td></tr></tbody>
    </table>
  </section>

  <div id="toast" class="toast hidden"></div>

  <script src="/app.js"></script>
</body>
</html>
